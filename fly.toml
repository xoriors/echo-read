# fly.io configuration for EchoRead.
#
# `app` must be globally unique across fly.io — change it if this name is
# taken, or run `flyctl launch --no-deploy` to have one generated.
app = "echo-read"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"

# SQLite lives on this volume. A volume attaches to exactly one machine, which
# is why the app is pinned to a single instance — see `flyctl scale count 1`.
# The machine may stop when idle; the volume persists, which is the whole point
# of it over in-memory state.
[mounts]
  source = "echoread_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle; the first request after a stop pays a cold start.
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
